[project]
name = "portfolio"
version = "0.1.0"
description = "Personal Quarto website and blog"
requires-python = ">=3.12"
dependencies = [
    "jupyter",
    "ipykernel",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly>=6.7.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "finlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Package ONLY the shared-code folder, not the whole website.
packages = ["blogkit"]

[tool.uv]
# Build and install just the blogkit package (above) as an editable install
# in the venv, so notebooks can `import blogkit...` from any folder. The
# website content (posts, .qmd, .ipynb) is NOT packaged — only blogkit/.
package = true

[tool.uv.sources]
finlib = { git = "https://github.com/jordanmckittrick/finlib" }

