[project]
name = "portfolio"
version = "0.1.0"
description = "Personal Quarto website and blog"
requires-python = ">=3.12"
dependencies = [
    "jupyter", # provides the kernel machinery Quarto needs to run code cells
    "ipykernel",
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "plotly>=6.7.0",
    "nbclient>=0.10.4",
    "nbformat>=5.10.4",
    "finlib",
]

[tool.uv]
# This is a website, not an installable Python package, so tell uv to manage
# only the dependencies above and not try to "build" the project itself.
package = false

[tool.uv.sources]
finlib = { git = "https://github.com/jordanmckittrick/finlib" }
