# ─────────────────────────────────────────────────────────────────────────────
# Site-wide configuration. Edit the ALL-CAPS placeholders, then `quarto preview`.
# Docs: https://quarto.org/docs/websites/
# ─────────────────────────────────────────────────────────────────────────────

project:
  type: website
  output-dir: _site          # build output (git-ignored; gets pushed to gh-pages)
  resources: 
    - CNAME

website:
  title: "Jordan McKittrick"
  description: "Notes on quantitative finance, information theory, and complex systems."
  site-url: "https://jordanmckittrick.github.io"   # ← your GitHub Pages URL (no trailing slash)
  favicon: profile.jpeg
  navbar:
    pinned: true
    left:
      # - href: index.qmd
      #   text: Home
      - href: blog.qmd
        text: Essays # Blog
      - href: recommendations.qmd
        text: Recommendations
      - href: about.qmd
        text: About        
    right:
      - icon: github
        href: https://github.com/jordanmckittrick
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/jordan-mckittrick-3b1bb638/
        aria-label: LinkedIn
    background: "#ffffff" # white
  page-footer:
    left: "© 2026 Jordan McKittrick"
    center: "Built with [Quarto](https://quarto.org)."
    right:
      - icon: github
        href: https://github.com/jordanmckittrick
      - icon: linkedin
        href: https://www.linkedin.com/in/jordan-mckittrick-3b1bb638/

format:
  html:
    theme:
      light: [cosmo, theme/light.scss]
      dark:  [darkly, theme/dark.scss]   # the moon toggle in the navbar switches these
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    code-tools: true        # adds a "view source" / code menu on posts
    highlight-style: github
    smooth-scroll: true
    grid:
      body-width: 920px
    # Figure-caption helpers (styled in styles.css). Quarto 1.9 has no option
    # for either, so they run in the browser:
    #  1. bold the "Figure N:" prefix, which Quarto emits as bare text;
    #  2. size each image's caption to the image's rendered width, and keep it
    #     in sync as the image loads or the window is resized.
    include-after-body:
      - text: |
          <script>
          (function () {
          document.querySelectorAll("figcaption.quarto-float-fig").forEach(function (cap) {
            var t = cap.firstChild;
            if (!t || t.nodeType !== Node.TEXT_NODE) return;
            var m = t.nodeValue.match(/^(\s*)(Figure\u00a0[^\s:]+:)/);
            if (!m) return;
            var b = document.createElement("strong");
            b.className = "fig-label";
            b.textContent = m[2];
            t.nodeValue = t.nodeValue.slice(m[0].length);
            cap.insertBefore(b, t);
          });
          var capObserver = new ResizeObserver(function (entries) {
            entries.forEach(function (e) {
              var cap = e.target.closest("figure").querySelector(":scope > figcaption");
              if (cap) cap.style.width = e.target.getBoundingClientRect().width + "px";
            });
          });
          document.querySelectorAll(
            ".quarto-figure > figure > div > img.figure-img, .quarto-figure > figure > p > img.figure-img"
          ).forEach(function (img) {
            var cap = img.closest("figure").querySelector(":scope > figcaption");
            if (!cap) return;
            cap.classList.add("fig-cap-fit");
            capObserver.observe(img);
          });
          })();
          </script>

# Cache executed code outputs. After the first render, code only re-runs when a
# document changes — fast previews, and it means a CI runner wouldn't need Python.
execute:
  freeze: auto