

# _brand.yml — single source of truth for the SITE's brand (colour + type).
# Lives at the project root, beside _quarto.yml. Quarto (>= 1.6) detects it
# automatically and themes the HTML output. It does NOT style Plotly figures;
# those are themed by blogkit/brand_plotly.py, which keeps its own palette.

color: # Note that these colors are used as a reference for the brand. You can't reference them in _quarto.yml or the .scss files.
  palette:
    hermes: "#1e3a8a" # a navy with a hint of purple mixed in. meaning= it's semantically neutral but unlike the grey spectrum it has color
    lapis_lazuli: "#3730a3"  # meaning = just a darker variant of periwinkle
    periwinkle: "#7575f7" # meaning = primary color, often denotes attainable reality
    lime:       "#84cc16" # meaning = secondary color, often denotes something that is unattainable
    orange:     "#f4511e" # meaning = "look here"
    ink:        "#1c1c22" # essentially black, but softer on the eyes for text and code. meaning = "neutral/scaffolding".
  foreground: ink
  background: "#ffffff" # white
  primary: periwinkle # lapis_lazuli is the back up primary color

typography:
  fonts:
    - family: Libre Baskerville
      source: google         # Quarto loads it; Apple users get true Baskerville
  base:
    family: Libre Baskerville
    size: 1.0rem           
    line-height: 1.65
  headings:
    family: Libre Baskerville