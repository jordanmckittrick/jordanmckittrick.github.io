<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll viewer — A Thousand Li of Rivers and Mountains</title>
<style>
  /* --------------------------------------------------------------------
     Page chrome — only used when previewing this file standalone.
     When you paste the .scroll-viewer block into index.qmd this
     surrounding chrome is not copied; only the widget itself.
     -------------------------------------------------------------------- */
  html { color-scheme: light dark; }
  body {
    font-family: "Libre Baskerville", Baskerville, Georgia, serif;
    max-width: 920px;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.55;
  }
  h1 { font-size: 1.25rem; font-weight: 400; opacity: 0.7; margin-bottom: 2rem; }

  /* --------------------------------------------------------------------
     The widget. Everything under .scroll-viewer is self-contained;
     this whole <figure> block plus the <script> at the bottom is what
     gets pasted into the .qmd.
     -------------------------------------------------------------------- */
  .scroll-viewer {
    margin: 2rem 0;
    padding: 0;
  }

  /* The "slit" — the fixed-size window through which the scroll moves.
     Width fills its column; height adapts within sane bounds. */
  .scroll-viewer__slit {
    position: relative;
    width: 100%;
    height: clamp(280px, 42vw, 500px);
    overflow: hidden;
    background: #1a1a1a; /* seen as narrow bars if the image is shorter than the slit */
    border-radius: 2px;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Poster (the still section image) — shown before the reader presses play.
     object-fit: cover crops the still to fill the slit at any aspect. */
  .scroll-viewer__poster {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
    transition: opacity 250ms ease;
  }

  /* The strip: two copies of the scroll image, back-to-back, translated left. */
  .scroll-viewer__strip {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    /* transform is set by JS; will-change hint keeps it on the GPU */
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }
  .scroll-viewer__strip {
    cursor: pointer; /* clicking the painting toggles pause/play */
  }
  .scroll-viewer__strip img {
    height: 100%;
    width: auto;
    display: block;
    flex-shrink: 0;
    pointer-events: none;
  }

  /* Control row along the bottom of the slit: play button + progress bar.
     z-index keeps the controls above the animated strip, which is appended
     to the slit later in DOM order and would otherwise cover them.
     Opacity is toggled by JS to auto-fade the controls during playback so
     the painting can be looked at without technocratic chrome in the way. */
  .scroll-viewer__controls {
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: 12px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 1;
    transition: opacity 400ms ease;
  }
  .scroll-viewer.is-controls-faded .scroll-viewer__controls {
    opacity: 0;
  }

  /* Play / pause button. */
  .scroll-viewer__toggle {
    position: relative;
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    padding: 0;
    border: none;
    border-radius: 50%;
    background: rgba(20, 20, 20, 0.72);
    color: white;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    transition: background 150ms ease, transform 100ms ease;
  }
  .scroll-viewer__toggle:hover { background: rgba(20, 20, 20, 0.9); }
  .scroll-viewer__toggle:active { transform: scale(0.94); }
  .scroll-viewer__toggle:focus-visible { outline: 2px solid #4a90e2; outline-offset: 2px; }
  .scroll-viewer__toggle[disabled] { cursor: wait; opacity: 0.6; }

  /* Loading indicator — a subtle spinning ring inside the button. */
  .scroll-viewer__toggle.is-loading::before {
    content: "";
    position: absolute;
    inset: 8px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: sv-spin 0.9s linear infinite;
  }
  @keyframes sv-spin { to { transform: rotate(360deg); } }
  .scroll-viewer__toggle.is-loading .scroll-viewer__icon { opacity: 0; }

  /* Progress / seek bar — hidden until first play (there's nothing to seek
     within a still image). Expands taller on hover for an easier target. */
  .scroll-viewer__progress {
    flex: 1 1 auto;
    height: 6px;
    background: rgba(255, 255, 255, 0.22);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
    display: none;
    transition: height 120ms ease, background 120ms ease;
    touch-action: none; /* let pointer events drive; don't scroll the page while scrubbing */
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .scroll-viewer.is-started .scroll-viewer__progress { display: block; }
  .scroll-viewer__progress:hover,
  .scroll-viewer__progress.is-dragging {
    height: 10px;
    background: rgba(255, 255, 255, 0.28);
  }
  .scroll-viewer__progress:focus-visible {
    outline: 2px solid #4a90e2;
    outline-offset: 3px;
  }
  .scroll-viewer__progress-fill {
    height: 100%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 3px;
    width: 0%;
    pointer-events: none;
    will-change: width;
  }

  .scroll-viewer figcaption {
    margin-top: 0.75rem;
    font-size: 0.9rem;
    line-height: 1.45;
    color: rgba(0, 0, 0, 0.66);
  }
  @media (prefers-color-scheme: dark) {
    .scroll-viewer figcaption { color: rgba(255, 255, 255, 0.66); }
  }
  .scroll-viewer figcaption a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }
</style>
</head>
<body>

<h1>Prototype — <em>scroll_viewer</em>. Open standalone; do not link from index.qmd.</h1>

<!-- =====================================================================
     THE WIDGET — this is what you eventually paste into index.qmd, at the
     end of "The rise of China" section (or wherever you want it).

     Configuration lives on data- attributes:
       data-poster       : the still shown before play
       data-scroll       : the animated (downscaled) scroll image
       data-full         : the full-resolution file, linked from the caption
       data-loop-seconds : one full traversal (right end to left end)
     ===================================================================== -->

<figure class="scroll-viewer"
        data-poster="a-thousand-li-of-rivers-and-mountains(section).jpg"
        data-scroll="a-thousand-li-of-rivers-and-mountains(scroll).jpg"
        data-full="a-thousand-li-of-rivers-and-mountains(complete).jpg"
        data-loop-seconds="240">
  <div class="scroll-viewer__slit">
    <img class="scroll-viewer__poster"
         src="a-thousand-li-of-rivers-and-mountains(section).jpg"
         alt="Wang Ximeng, A Thousand Li of Rivers and Mountains">
    <div class="scroll-viewer__controls">
      <button class="scroll-viewer__toggle"
              type="button"
              aria-label="Play the scroll animation">
        <span class="scroll-viewer__icon" aria-hidden="true">&#9654;</span>
      </button>
      <div class="scroll-viewer__progress"
           role="slider"
           tabindex="0"
           aria-label="Scroll position"
           aria-valuemin="0"
           aria-valuemax="100"
           aria-valuenow="0">
        <div class="scroll-viewer__progress-fill"></div>
      </div>
    </div>
  </div>
  <figcaption>
    Wang Ximeng, <em>A Thousand Li of Rivers and Mountains</em>, 1113. The Palace Museum, Beijing.
    <a href="a-thousand-li-of-rivers-and-mountains(complete).jpg" target="_blank" rel="noopener">View full resolution&nbsp;↗</a>
  </figcaption>
</figure>

<script>
(function () {
  // Play / pause icons (Unicode). Kept as strings, not SVG, to keep the widget compact.
  const ICON_PLAY  = "▶";  // ▶
  const ICON_PAUSE = "⏸";  // ⏸

  const REDUCED_MOTION =
    window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function init(root) {
    const slit    = root.querySelector(".scroll-viewer__slit");
    const poster  = root.querySelector(".scroll-viewer__poster");
    const btn     = root.querySelector(".scroll-viewer__toggle");
    const iconEl  = btn.querySelector(".scroll-viewer__icon");
    const bar     = root.querySelector(".scroll-viewer__progress");
    const fill    = root.querySelector(".scroll-viewer__progress-fill");

    const scrollSrc    = root.dataset.scroll;
    const loopSeconds  = Math.max(10, parseFloat(root.dataset.loopSeconds) || 120);

    let strip = null;          // the DOM element containing two <img> copies
    let imgDisplayedWidth = 0; // width, in CSS px, of one displayed copy at current slit height
    let offset = 0;            // current leftward translation, in CSS px
    let rafId = null;
    let lastTs = 0;
    let state = "idle";        // "idle" | "loading" | "playing" | "paused"

    // ---- Auto-fade of controls during playback.
    const CONTROLS_FADE_MS = 2500;
    let fadeTimer = null;

    function scheduleFade() {
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(function () {
        // Only fade while actively playing and not mid-scrub.
        if (state === "playing" && !dragging) {
          root.classList.add("is-controls-faded");
        }
      }, CONTROLS_FADE_MS);
    }

    function revealControls() {
      root.classList.remove("is-controls-faded");
      clearTimeout(fadeTimer);
      if (state === "playing") scheduleFade();
    }

    // ---- Build the animated strip (two copies of the scroll image, back-to-back).
    function buildStrip(imgSrc, naturalW, naturalH) {
      strip = document.createElement("div");
      strip.className = "scroll-viewer__strip";
      for (let i = 0; i < 2; i++) {
        const im = document.createElement("img");
        im.src = imgSrc;
        im.alt = "";                       // decorative; the caption carries the meaning
        im.setAttribute("aria-hidden", "true");
        im.draggable = false;
        strip.appendChild(im);
      }
      // Cache aspect ratio for width recomputation on resize.
      strip.dataset.aspect = String(naturalW / naturalH);
      // Clicking the painting itself toggles pause/play, same as the button.
      strip.addEventListener("click", function () {
        if (state === "playing") pause();
        else if (state === "paused") play();
      });
      slit.appendChild(strip);
      recomputeWidth();
    }

    function recomputeWidth() {
      if (!strip) return;
      const aspect = parseFloat(strip.dataset.aspect);
      const h = slit.clientHeight;
      imgDisplayedWidth = h * aspect;
      // If offset has drifted past the new width, wrap it.
      offset = ((offset % imgDisplayedWidth) + imgDisplayedWidth) % imgDisplayedWidth;
      applyTransform();
    }

    function applyTransform() {
      if (!strip) return;
      strip.style.transform = "translate3d(" + (-offset).toFixed(2) + "px, 0, 0)";
      // Keep the progress bar and its ARIA value in sync with the offset.
      if (imgDisplayedWidth > 0) {
        const frac = offset / imgDisplayedWidth;
        fill.style.width = (frac * 100).toFixed(2) + "%";
        bar.setAttribute("aria-valuenow", Math.round(frac * 100));
      }
    }

    // ---- rAF loop.
    function tick(ts) {
      if (state !== "playing") return;
      if (!lastTs) lastTs = ts;
      const dt = (ts - lastTs) / 1000;   // seconds
      lastTs = ts;

      // Speed derived from loop duration: one full imageWidth per loopSeconds.
      const speed = imgDisplayedWidth / loopSeconds; // px/sec
      offset += speed * dt;
      if (offset >= imgDisplayedWidth) offset -= imgDisplayedWidth;

      applyTransform();
      rafId = requestAnimationFrame(tick);
    }

    // ---- State transitions.
    function setIcon(sym) { iconEl.textContent = sym; }

    function loadThenPlay() {
      if (state === "loading" || state === "playing") return;
      state = "loading";
      btn.disabled = true;
      btn.classList.add("is-loading");
      btn.setAttribute("aria-label", "Loading");

      const im = new Image();
      im.onload = function () {
        buildStrip(scrollSrc, im.naturalWidth, im.naturalHeight);
        // Fade out the poster once the strip is in place.
        poster.style.opacity = "0";
        setTimeout(() => { poster.style.display = "none"; }, 260);

        btn.classList.remove("is-loading");
        btn.disabled = false;
        root.classList.add("is-started");   // reveal the progress bar
        play();
      };
      im.onerror = function () {
        btn.classList.remove("is-loading");
        btn.disabled = false;
        state = "idle";
        btn.setAttribute("aria-label", "Play the scroll animation");
        console.warn("scroll-viewer: failed to load", scrollSrc);
      };
      im.src = scrollSrc;
    }

    function play() {
      if (!strip) { loadThenPlay(); return; }
      state = "playing";
      setIcon(ICON_PAUSE);
      btn.setAttribute("aria-label", "Pause the scroll animation");
      lastTs = 0;
      rafId = requestAnimationFrame(tick);
      scheduleFade();
    }

    function pause() {
      if (state !== "playing") return;
      state = "paused";
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      setIcon(ICON_PLAY);
      btn.setAttribute("aria-label", "Resume the scroll animation");
      // While paused, keep the controls visible — the reader is engaged.
      root.classList.remove("is-controls-faded");
      clearTimeout(fadeTimer);
    }

    // ---- Wire up controls.
    btn.addEventListener("click", function () {
      if (state === "playing") pause();
      else if (state === "paused") play();
      else if (state === "idle") loadThenPlay();
      // "loading": button is disabled, no action.
    });

    // ---- Scrubbing: click or drag the progress bar to seek within the loop.
    // One unified handler covers mouse, touch and pen via Pointer Events.
    let dragging = false;
    let wasPlayingBeforeDrag = false;

    function seekFromEvent(ev) {
      if (!strip || imgDisplayedWidth <= 0) return;
      const rect = bar.getBoundingClientRect();
      let frac = (ev.clientX - rect.left) / rect.width;
      frac = Math.max(0, Math.min(1, frac));
      offset = frac * imgDisplayedWidth;
      applyTransform();
    }

    bar.addEventListener("pointerdown", function (ev) {
      if (!strip) return;
      dragging = true;
      wasPlayingBeforeDrag = (state === "playing");
      if (wasPlayingBeforeDrag) pause();
      bar.classList.add("is-dragging");
      bar.setPointerCapture(ev.pointerId);
      seekFromEvent(ev);
      ev.preventDefault();
    });

    bar.addEventListener("pointermove", function (ev) {
      if (!dragging) return;
      seekFromEvent(ev);
    });

    function endDrag(ev) {
      if (!dragging) return;
      dragging = false;
      bar.classList.remove("is-dragging");
      try { bar.releasePointerCapture(ev.pointerId); } catch (e) { /* ignore */ }
      if (wasPlayingBeforeDrag) play();
    }
    bar.addEventListener("pointerup", endDrag);
    bar.addEventListener("pointercancel", endDrag);

    // Keyboard: arrow keys nudge the position, Home/End jump to ends.
    bar.addEventListener("keydown", function (ev) {
      if (!strip || imgDisplayedWidth <= 0) return;
      const nudge = imgDisplayedWidth * 0.02; // 2% per keypress
      const big   = imgDisplayedWidth * 0.10; // 10% with shift
      let handled = true;
      switch (ev.key) {
        case "ArrowRight": offset += (ev.shiftKey ? big : nudge); break;
        case "ArrowLeft":  offset -= (ev.shiftKey ? big : nudge); break;
        case "Home":       offset = 0; break;
        case "End":        offset = imgDisplayedWidth - 1; break;
        default: handled = false;
      }
      if (handled) {
        offset = ((offset % imgDisplayedWidth) + imgDisplayedWidth) % imgDisplayedWidth;
        applyTransform();
        ev.preventDefault();
      }
    });

    // Recompute geometry on resize (debounced via rAF).
    let resizePending = false;
    window.addEventListener("resize", function () {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(function () {
        resizePending = false;
        recomputeWidth();
      });
    });

    // Any pointer activity anywhere inside the slit reveals the controls
    // and restarts the idle countdown (if we're still playing).
    slit.addEventListener("pointermove", revealControls);
    slit.addEventListener("pointerdown", revealControls);
    slit.addEventListener("touchstart", revealControls, { passive: true });

    // Keyboard focus on a control also reveals — never hide a focused element.
    btn.addEventListener("focus", revealControls);
    bar.addEventListener("focus", revealControls);

    // Pause when the tab is hidden — no need to burn cycles for something no one sees.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && state === "playing") {
        pause();
        root.dataset.wasPlaying = "1";
      } else if (!document.hidden && root.dataset.wasPlaying === "1") {
        root.dataset.wasPlaying = "";
        play();
      }
    });

    // Reduced motion: never autoplay. The button still works if the reader
    // opts in by clicking; user-initiated animation is fine per the spec.
    // (We don't autoplay in any case, so this is only a placeholder for future use.)
    void REDUCED_MOTION;
  }

  // Initialise every .scroll-viewer on the page.
  document.querySelectorAll(".scroll-viewer").forEach(init);
})();
</script>

</body>
</html>
